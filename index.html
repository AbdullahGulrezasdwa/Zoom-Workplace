<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zoom Workplace Web is a single-file, GitHub Pages-ready collaboration app with meetings, team chat, contacts, tasks, and notes.">
  <title>Zoom Workplace Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  --bg: #eef5ff;
  --panel: rgba(255, 255, 255, 0.78);
  --text: #101a31;
  --muted: #6c7894;
  --line: rgba(16, 26, 49, 0.08);
  --line-strong: rgba(16, 26, 49, 0.14);
  --accent: #1171ff;
  --accent-strong: #0a53ca;
  --accent-soft: rgba(17, 113, 255, 0.12);
  --accent-glow: rgba(17, 113, 255, 0.24);
  --success: #109b64;
  --warning: #f59e0b;
  --danger: #e25561;
  --shadow-lg: 0 28px 80px rgba(20, 43, 89, 0.16);
  --shadow-md: 0 16px 42px rgba(17, 34, 68, 0.12);
  --shadow-sm: 0 10px 24px rgba(17, 34, 68, 0.08);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 18px;
}

body[data-accent="ember"] {
  --accent: #ff7a18;
  --accent-strong: #d85a00;
  --accent-soft: rgba(255, 122, 24, 0.14);
  --accent-glow: rgba(255, 122, 24, 0.24);
}

body[data-accent="mint"] {
  --accent: #06b68d;
  --accent-strong: #0a8668;
  --accent-soft: rgba(6, 182, 141, 0.14);
  --accent-glow: rgba(6, 182, 141, 0.24);
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Manrope", "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(17, 113, 255, 0.16), transparent 34%),
    radial-gradient(circle at top right, rgba(255, 145, 77, 0.12), transparent 30%),
    linear-gradient(180deg, #f6fbff 0%, var(--bg) 46%, #eff4fb 100%);
}

body::before,
body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  filter: blur(16px);
  pointer-events: none;
  z-index: -1;
}

body::before {
  width: 340px;
  height: 340px;
  top: 4rem;
  right: -6rem;
  background: rgba(17, 113, 255, 0.18);
}

body::after {
  width: 280px;
  height: 280px;
  bottom: -4rem;
  left: -4rem;
  background: rgba(255, 122, 24, 0.16);
}

.auth-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 2rem;
}

.auth-grid {
  width: min(1080px, 100%);
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 1rem;
}

.auth-card,
.auth-side-card {
  padding: 1.4rem;
  border-radius: 30px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(16, 26, 49, 0.08);
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(18px);
}

.auth-card h1,
.auth-side-card h3 {
  margin: 0;
}

.auth-stack,
.auth-bullets,
.setup-steps {
  display: grid;
  gap: 0.9rem;
}

.auth-bullets,
.setup-steps {
  margin-top: 1.1rem;
}

.auth-bullet,
.setup-step {
  padding: 0.95rem 1rem;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.74);
  border: 1px solid rgba(16, 26, 49, 0.06);
}

.setup-code {
  margin-top: 1rem;
  padding: 1rem;
  border-radius: 20px;
  background: rgba(10, 18, 35, 0.96);
  color: #eef4ff;
  font-family: "Sora", "Segoe UI", sans-serif;
  font-size: 0.84rem;
  line-height: 1.7;
  overflow: auto;
  white-space: pre-wrap;
}

body.compact-mode .card,
body.compact-mode .panel,
body.compact-mode .hero-card,
body.compact-mode .schedule-list-card,
body.compact-mode .chat-panel,
body.compact-mode .chat-list,
body.compact-mode .contact-card,
body.compact-mode .task-card,
body.compact-mode .note-card,
body.compact-mode .settings-card,
body.compact-mode .room-card,
body.compact-mode .conversation-card {
  border-radius: 16px;
}

body.compact-mode .main-stage {
  padding-top: 0.8rem;
}

body.modal-open {
  overflow: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
  color: inherit;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.84);
  color: var(--text);
  padding: 0.9rem 1rem;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}

input:focus,
textarea:focus,
select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.field-stack {
  display: grid;
  gap: 0.45rem;
}

.field-stack label {
  font-size: 0.88rem;
  color: var(--muted);
}

textarea {
  resize: vertical;
  min-height: 140px;
}

.hidden {
  display: none !important;
}

.app-shell {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 290px;
  flex-shrink: 0;
  padding: 1.6rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  background: rgba(8, 18, 39, 0.88);
  color: #ebf1ff;
  backdrop-filter: blur(18px);
  position: relative;
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}

.sidebar::before {
  content: "";
  position: absolute;
  inset: 1.25rem;
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  pointer-events: none;
}

.workspace {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.brand-block,
.presence-card,
.card,
.panel,
.hero-card,
.schedule-list-card,
.contact-card,
.task-card,
.note-card,
.chat-panel,
.chat-list,
.conversation-card,
.room-card,
.settings-card,
.meeting-room-shell {
  box-shadow: var(--shadow-md);
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 1.1rem 1rem;
  border-radius: 24px;
  background: linear-gradient(145deg, rgba(18, 32, 66, 0.92), rgba(11, 21, 40, 0.82));
}

.brand-mark {
  position: relative;
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, rgba(17, 113, 255, 0.18), rgba(255, 255, 255, 0.1));
}

.brand-ring,
.brand-core {
  position: absolute;
  border-radius: 50%;
}

.brand-ring {
  width: 28px;
  height: 28px;
  border: 4px solid rgba(17, 113, 255, 0.8);
  border-right-color: rgba(17, 113, 255, 0.3);
}

.brand-core {
  width: 12px;
  height: 12px;
  background: linear-gradient(145deg, #fff, rgba(255, 255, 255, 0.5));
}

.brand-kicker,
.eyebrow {
  margin: 0 0 0.2rem;
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

.sidebar .eyebrow,
.brand-kicker,
.sidebar p {
  color: rgba(235, 241, 255, 0.66);
}

.brand-name,
.topbar h2,
.section-title,
.hero-title,
.room-title,
.modal-title {
  margin: 0;
  font-family: "Sora", "Segoe UI", sans-serif;
  letter-spacing: -0.03em;
}

.presence-card {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  padding: 1rem;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.08);
}

.presence-card p {
  margin: 0.18rem 0 0;
  font-size: 0.9rem;
}

.avatar {
  display: inline-grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 18px;
  background: linear-gradient(145deg, rgba(17, 113, 255, 0.88), rgba(17, 113, 255, 0.58));
  color: white;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.avatar-large {
  width: 50px;
  height: 50px;
}

.avatar-medium {
  width: 44px;
  height: 44px;
}

.avatar-small {
  width: 34px;
  height: 34px;
  border-radius: 14px;
  font-size: 0.86rem;
}

.status-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  display: inline-block;
  box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.08);
}

.presence-card > .status-dot {
  margin-left: auto;
}

.online {
  background: #18c47d;
}

.away {
  background: #f59e0b;
}

.busy {
  background: #f05454;
}

.offline {
  background: #8a94b4;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}

.nav-button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.95rem 1rem;
  border-radius: 18px;
  background: transparent;
  color: rgba(235, 241, 255, 0.88);
  text-align: left;
  transition: background 160ms ease, transform 160ms ease, color 160ms ease;
}

.nav-button:hover,
.nav-button:focus-visible,
.nav-button.active {
  background: rgba(255, 255, 255, 0.12);
  color: white;
  transform: translateX(2px);
}

.nav-icon {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.08);
  font-size: 0.86rem;
}

.nav-badge {
  margin-left: auto;
  min-width: 24px;
  padding: 0.15rem 0.4rem;
  border-radius: 999px;
  background: rgba(17, 113, 255, 0.24);
  color: white;
  font-size: 0.75rem;
  text-align: center;
}

.sidebar-footer {
  margin-top: auto;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.08));
  padding: 1.15rem;
  border-radius: 24px;
  color: #ebf1ff;
}

.sidebar-stat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.8rem 0;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}

.sidebar-stat:first-of-type {
  border-top: 0;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: center;
  padding: 1.35rem 1.5rem 0.75rem;
  backdrop-filter: blur(18px);
}

.topbar-left,
.topbar-right,
.hero-actions,
.toolbar-row,
.section-head,
.modal-actions,
.empty-state,
.chip-row,
.control-row {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  flex-wrap: wrap;
}

.topbar h2 {
  font-size: 1.7rem;
}

.search-field {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  width: min(380px, 42vw);
  padding: 0.1rem 0.35rem 0.1rem 0.95rem;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.76);
  border: 1px solid rgba(255, 255, 255, 0.74);
  box-shadow: var(--shadow-sm);
}

.search-field input {
  border: 0;
  background: transparent;
  padding: 0.8rem 0.4rem 0.8rem 0;
  box-shadow: none;
}

.search-prefix {
  color: var(--muted);
  font-size: 1rem;
}

.topbar-chip,
.meta-chip,
.priority-pill,
.presence-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  border-radius: 999px;
  padding: 0.45rem 0.82rem;
  font-size: 0.86rem;
}

.topbar-chip,
.meta-chip,
.presence-pill {
  background: rgba(255, 255, 255, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.64);
  box-shadow: var(--shadow-sm);
}

.profile-pill {
  width: 46px;
  height: 46px;
  border-radius: 16px;
  background: linear-gradient(145deg, var(--accent), var(--accent-strong));
  color: white;
  font-weight: 800;
  box-shadow: 0 18px 32px var(--accent-glow);
}

.main-stage {
  padding: 1rem 1.5rem 1.6rem;
}

#app-view {
  display: grid;
  gap: 1.1rem;
}

.card,
.panel,
.chat-panel,
.chat-list,
.contact-card,
.task-card,
.note-card,
.settings-card,
.hero-card,
.schedule-list-card,
.room-card,
.conversation-card {
  border-radius: var(--radius-lg);
  background: var(--panel);
  border: 1px solid rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px);
}

.hero-strip {
  display: grid;
  grid-template-columns: 1.55fr 1fr;
  gap: 1rem;
}

.zoom-home-shell {
  display: grid;
  grid-template-columns: 1.45fr 0.95fr;
  gap: 1rem;
}

.zoom-launch-panel {
  padding: 1.3rem;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(240, 247, 255, 0.86));
}

.zoom-launch-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.9rem;
  margin-top: 1rem;
}

.zoom-launch-tile {
  min-height: 172px;
  padding: 1.2rem;
  border-radius: 26px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  text-align: left;
  position: relative;
  overflow: hidden;
  color: white;
  box-shadow: var(--shadow-md);
}

.zoom-launch-tile::before {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  right: -40px;
  top: -50px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
}

.zoom-launch-tile strong,
.zoom-launch-tile span {
  position: relative;
}

.zoom-launch-tile strong {
  display: block;
  margin-top: auto;
  font-size: 1.02rem;
}

.zoom-launch-tile span:last-child {
  color: rgba(255, 255, 255, 0.82);
  line-height: 1.55;
  margin-top: 0.45rem;
  max-width: 18ch;
}

.zoom-tile-mark {
  width: 58px;
  height: 58px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, 0.18);
  font-size: 1.2rem;
  font-weight: 800;
}

.zoom-launch-tile[data-tone="orange"] {
  background: linear-gradient(145deg, #ff8a1f, #e96b00);
}

.zoom-launch-tile[data-tone="blue"] {
  background: linear-gradient(145deg, #1682ff, #0858d8);
}

.zoom-launch-tile[data-tone="slate"] {
  background: linear-gradient(145deg, #325178, #1d2f4a);
}

.zoom-launch-tile[data-tone="green"] {
  background: linear-gradient(145deg, #0db58d, #0b7e63);
}

.zoom-join-strip {
  margin-top: 1rem;
  padding: 1rem;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.74);
  border: 1px solid rgba(16, 26, 49, 0.06);
}

.zoom-join-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.8rem;
  align-items: center;
}

.zoom-rail {
  display: grid;
  gap: 1rem;
}

.zoom-spotlight {
  padding: 1.25rem;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at top right, rgba(255, 255, 255, 0.18), transparent 24%),
    linear-gradient(145deg, rgba(7, 20, 51, 0.96), rgba(17, 113, 255, 0.8));
  color: white;
  box-shadow: var(--shadow-md);
}

.zoom-spotlight .eyebrow {
  color: rgba(255, 255, 255, 0.62);
}

.zoom-spotlight p {
  color: rgba(255, 255, 255, 0.84);
}

.zoom-room-window {
  margin-top: 1rem;
  padding: 0.9rem;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.zoom-room-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.75rem;
}

.zoom-room-tile {
  min-height: 110px;
  padding: 0.85rem;
  border-radius: 18px;
  background: rgba(10, 16, 32, 0.58);
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.zoom-room-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.32rem 0.55rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  font-size: 0.8rem;
}

.zoom-home-stats {
  margin-top: 1rem;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.8rem;
}

.zoom-home-stat {
  padding: 0.9rem 1rem;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.12);
}

.zoom-home-stat strong {
  display: block;
  font-size: 1.1rem;
}

.hero-card {
  overflow: hidden;
  position: relative;
  padding: 1.45rem;
  background:
    radial-gradient(circle at top right, rgba(255, 255, 255, 0.18), transparent 24%),
    linear-gradient(140deg, rgba(7, 20, 51, 0.92), rgba(17, 113, 255, 0.88));
  color: white;
}

.hero-card::before {
  content: "";
  position: absolute;
  inset: auto 0 -40px auto;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
}

.hero-title {
  font-size: clamp(2rem, 3vw, 3rem);
  max-width: 10ch;
}

.hero-subtitle {
  max-width: 56ch;
  color: rgba(255, 255, 255, 0.86);
  line-height: 1.7;
}

.hero-metrics {
  margin-top: 1.25rem;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.8rem;
}

.hero-metric,
.metric-card,
.summary-card,
.mini-stat,
.settings-card,
.meeting-card,
.agenda-item {
  padding: 1rem;
  border-radius: 18px;
}

.hero-metric {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.hero-metric strong,
.metric-card strong,
.sidebar-stat strong {
  display: block;
  font-size: 1.15rem;
}

.summary-column,
.dashboard-stack,
.meeting-right-rail,
.settings-stack,
.task-column,
.search-group,
.form-grid,
.meeting-list,
.agenda-list,
.contact-grid,
.note-list,
.room-grid,
.theme-grid {
  display: grid;
  gap: 0.85rem;
}

.metric-grid,
.dashboard-grid,
.meetings-layout,
.contacts-layout,
.tasks-layout,
.notes-layout,
.settings-layout,
.chat-layout,
.quick-grid,
.team-grid,
.form-grid.two-up {
  display: grid;
  gap: 1rem;
}

.metric-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.dashboard-grid {
  grid-template-columns: 1.45fr 1fr;
}

.meetings-layout {
  grid-template-columns: 1.45fr 0.95fr;
}

.chat-layout {
  grid-template-columns: 360px minmax(0, 1fr);
}

.notes-layout {
  grid-template-columns: 340px minmax(0, 1fr);
}

.settings-layout {
  grid-template-columns: 1.2fr 1fr;
}

.tasks-layout {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.section-head,
.toolbar-row,
.column-head,
.meeting-card-header,
.contact-card-header,
.task-card-header,
.note-card-header,
.conversation-card-header,
.chat-header,
.meeting-room-head,
.modal-header,
.search-item {
  justify-content: space-between;
}

.section-title,
.meeting-card h4,
.contact-card h4,
.task-card h4,
.note-card h4,
.room-card h4,
.conversation-card h4,
.summary-card h3,
.panel h3,
.chat-panel h3,
.schedule-list-card h3,
.modal-title,
.column-head h3 {
  margin: 0;
}

.section-subtle,
.summary-card p,
.panel p,
.contact-card p,
.task-card p,
.note-card p,
.settings-card p,
.conversation-card p,
.meeting-room-head p {
  color: var(--muted);
  margin: 0.25rem 0 0;
}

.agenda-item,
.meeting-card,
.room-card,
.contact-card,
.task-card,
.note-card,
.conversation-card,
.settings-card {
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid rgba(16, 26, 49, 0.06);
  transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
}

.agenda-item:hover,
.meeting-card:hover,
.room-card:hover,
.contact-card:hover,
.task-card:hover,
.note-card:hover,
.conversation-card:hover,
.member-chip:hover {
  transform: translateY(-2px);

  const raw = user?.user_metadata?.full_name
    || user?.user_metadata?.name
    || user?.email?.split("@")[0]

  return String(raw)
    .replace(/[._-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .replace(/\b\w/g, (part) => part.toUpperCase());

async function initializeAuth() {
  app.data = createSeedState();
  renderAuthGate();

  if (!hasSupabaseConfig()) {
    app.authReady = true;
    renderAuthGate();
    return;
  }

  try {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm");
    app.supabase = createClient(SUPABASE_CONFIG.supabaseUrl, SUPABASE_CONFIG.supabaseAnonKey, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });
    app.authError = "";
  } catch (error) {
    app.authReady = true;
    app.authError = "Supabase client failed to load. Check your network connection or CDN access.";
    renderAuthGate();
    return;
  }

  app.supabase.auth.onAuthStateChange((_event, session) => {
    window.setTimeout(() => {
      void syncSession(session);
    }, 0);
  });

  const { data, error } = await app.supabase.auth.getSession();
  if (error) {
    notify("Auth check failed", error.message, true);
  }
  await syncSession(data?.session || null);
}

async function syncSession(session) {
  app.session = session;
  app.user = session?.user || null;

  if (!app.user) {
    app.data = createSeedState();
    app.authReady = true;
    renderAuthGate();
    return;
  }

  await loadCloudWorkspace();
  app.authReady = true;
  renderAuthGate();
  applySettings();
  renderApp();
}

async function signInWorkspace(formData) {
  if (!app.supabase) {
    return;
  }

  const email = String(formData.get("email") || "").trim();
  const password = String(formData.get("password") || "").trim();
  const { error } = await app.supabase.auth.signInWithPassword({ email, password });

  if (error) {
    notify("Sign in failed", error.message, true);
    return;
  }

  notify("Signed in", "Your real workspace is loading.");
}

async function signUpWorkspace(formData) {
  if (!app.supabase) {
    return;
  }

  const email = String(formData.get("email") || "").trim();
  const password = String(formData.get("password") || "").trim();
  const name = String(formData.get("name") || "").trim();

  const { data, error } = await app.supabase.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: `${window.location.origin || ""}${window.location.pathname || ""}`,
      data: {
        full_name: name
      }
    }
  });

  if (error) {
    notify("Sign up failed", error.message, true);
    return;
  }

  if (!data.session) {
    notify("Check your email", "Confirm your Supabase account, then sign in.", false);
    app.authMode = "signin";
    renderAuthGate("Account created. Confirm your email, then sign in.");
    return;
  }

  notify("Account created", "Your real workspace is ready.");
}

async function signOutWorkspace() {
  if (!app.supabase) {
    return;
  }

  window.clearTimeout(app.cloudSaveTimer);
  app.cloudStatus = "synced";
  const { error } = await app.supabase.auth.signOut();
  if (error) {
    notify("Sign out failed", error.message, true);
    return;
  }

  app.activeRoomCode = null;
  closeModal();
  notify("Signed out", "You are back at the secure login screen.");
}

async function loadCloudWorkspace() {
  if (!app.supabase || !app.user) {
    app.data = createSeedState();
    app.cloudStatus = "synced";
    return;
  }

  try {
    const { data, error } = await app.supabase
      .from(WORKSPACE_TABLE)
      .select("payload")
      .eq("user_id", app.user.id)
      .maybeSingle();

    if (error) {
      throw error;
    }

    app.data = data?.payload ? sanitizeImportedState(data.payload) : createSeedState();
    app.cloudStatus = "synced";
  } catch (error) {
    app.data = loadState();
    app.cloudStatus = "cache";
    notify("Cloud load failed", "Using the last cached workspace on this device.", true);
  }

  syncProfileWithUser();
  app.activeChatId = app.data.ui?.activeChatId || app.data.chats[0]?.id || null;
  app.activeNoteId = app.data.ui?.activeNoteId || app.data.notes[0]?.id || null;
  app.contactFilter = app.data.ui?.contactFilter || "all";
  app.contactSort = app.data.ui?.contactSort || "smart";
  saveState();
}

function syncProfileWithUser() {
  if (!app.data) {
    return;
  }

  app.data.profile = {
    ...app.data.profile,
    name: app.data.profile?.name || getUserDisplayName(),
    role: app.data.profile?.role || "Workspace Owner",
    email: app.user?.email || app.data.profile?.email || ""
  };
}

async function persistCloudWorkspace() {
  if (!app.supabase || !app.user || !app.data) {
    return;
  }

  syncProfileWithUser();
  app.cloudSaving = true;
  app.cloudStatus = "syncing";
  syncCloudStatusChip();

  const { error } = await app.supabase
    .from(WORKSPACE_TABLE)
    .upsert({
      user_id: app.user.id,
      email: app.user.email || "",
      payload: app.data,
      updated_at: new Date().toISOString()
    }, {
      onConflict: "user_id"
    });

  app.cloudSaving = false;

  if (error) {
    app.cloudStatus = "issue";
    syncCloudStatusChip();
    notify("Cloud save failed", "Check your Supabase table and row-level security setup.", true);
    return;
  }

  app.cloudStatus = "synced";
  syncCloudStatusChip();
}

function initBroadcast() {

    app.broadcaster.onmessage = (event) => {

  window.addEventListener("storage", (event) => {
    if (event.key?.startsWith(STORAGE_KEY)) {
      hydrateState();
    }

  window.addEventListener("hashchange", handleRoomHash);
}

  }

  }

    openTaskModal(target.dataset.id || null);

async function handleSubmit(event) {
  const form = event.target;

  if (form.dataset.form === "auth-signin") {
    event.preventDefault();
    await signInWorkspace(new FormData(form));
  }

  if (form.dataset.form === "auth-signup") {
    event.preventDefault();
    await signUpWorkspace(new FormData(form));
  }

  if (form.dataset.form === "schedule-meeting") {
    event.preventDefault();
    scheduleMeeting(new FormData(form));
  }

  if (form.dataset.form === "join-room") {
    event.preventDefault();
    const roomCode = normalizeRoomCode(form.elements.roomCode.value);
    if (!roomCode) {
      notify("Enter a room code", "Meeting rooms need a simple room name to launch.", true);
      return;
    }
    openMeetingRoom(roomCode, "Joined Room");
    form.reset();
  }

  if (form.dataset.form === "send-message") {
    event.preventDefault();
    const content = form.elements.message.value.trim();
    if (!content || !app.activeChatId) {
      return;
    }
    sendMessage(app.activeChatId, content);
    form.reset();
  }

  if (form.dataset.form === "contact-form") {
    event.preventDefault();
    saveContact(new FormData(form));
  }

  if (form.dataset.form === "quick-contact-form") {
    event.preventDefault();
    saveQuickContact(new FormData(form));
    form.reset();
  }

  if (form.dataset.form === "task-form") {
    event.preventDefault();
    saveTask(new FormData(form));
  }

  if (form.dataset.form === "chat-form") {
    event.preventDefault();
    saveChat(new FormData(form));
  }
}

function handleKeydown(event) {
  if (event.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
    event.preventDefault();
    document.getElementById("global-search").focus();
  }

  if (event.key === "Escape") {

    hideSearchResults();
    closeSidebar();
  }
}

function handleImport(event) {
  const file = event.target.files?.[0];
  if (!file) {
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      app.data = sanitizeImportedState(parsed);
      app.activeChatId = app.data.ui?.activeChatId || app.data.chats[0]?.id || null;
      app.activeNoteId = app.data.ui?.activeNoteId || app.data.notes[0]?.id || null;
      app.contactFilter = app.data.ui?.contactFilter || "all";
      app.contactSort = app.data.ui?.contactSort || "smart";
      saveState();
      applySettings();
      renderApp();
      notify("Workspace imported", "Your meetings, contacts, tasks, and notes were restored.");
    } catch (error) {
      notify("Import failed", "The file was not valid workspace JSON.", true);
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

async function handleCSVContactImport(event) {
  const file = event.target.files?.[0];
  if (!file) {
    return;
  }

  try {
    const contacts = parseCSVContacts(await readFileAsText(file));
    importContacts(contacts, "csv");
  } catch (error) {
    notify("CSV import failed", "The contacts file could not be read.", true);
  } finally {
    event.target.value = "";
  }
}

async function handleVCFContactImport(event) {
  const file = event.target.files?.[0];
  if (!file) {
    return;
  }

  try {
    const contacts = parseVCFContacts(await readFileAsText(file));
    importContacts(contacts, "vcf");

async function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("File read failed"));
    reader.readAsText(file);
  });
}

function sanitizeImportedState(data) {
  const fallback = createSeedState();
  const safeData = data && typeof data === "object" ? data : {};
  const hasMeetings = Array.isArray(safeData.meetings);
  const hasContacts = Array.isArray(safeData.contacts);
  const hasChats = Array.isArray(safeData.chats);
  const hasTasks = Array.isArray(safeData.tasks);
  const hasNotes = Array.isArray(safeData.notes);
  const meetings = coerceArray(safeData.meetings).map(normalizeMeeting).filter(Boolean);
  const contacts = coerceArray(safeData.contacts).map(normalizeContact).filter(Boolean);
  const chats = coerceArray(safeData.chats).map(normalizeChat).filter(Boolean);
  const tasks = coerceArray(safeData.tasks).map(normalizeTask).filter(Boolean);
  const notes = coerceArray(safeData.notes).map(normalizeNote).filter(Boolean);
  const activeChatId = safeData.ui?.activeChatId;
  const activeNoteId = safeData.ui?.activeNoteId;
  const contactFilter = ["all", "real", "favorite", "available"].includes(safeData.ui?.contactFilter) ? safeData.ui.contactFilter : fallback.ui.contactFilter;
  const contactSort = ["smart", "recent", "name", "company"].includes(safeData.ui?.contactSort) ? safeData.ui.contactSort : fallback.ui.contactSort;

  return {
    profile: {
      ...fallback.profile,
      ...(safeData.profile || {})
    },
    settings: {
      ...fallback.settings,
      ...(safeData.settings || {})
    },
    meetings: hasMeetings ? meetings : fallback.meetings,
    contacts: hasContacts ? contacts : fallback.contacts,
    chats: hasChats ? chats : fallback.chats,
    tasks: hasTasks ? tasks : fallback.tasks,
    notes: hasNotes ? notes : fallback.notes,
    ui: {
      activeChatId: chats.some((chat) => chat.id === activeChatId) ? activeChatId : (chats[0]?.id || (hasChats ? null : fallback.ui.activeChatId)),
      activeNoteId: notes.some((note) => note.id === activeNoteId) ? activeNoteId : (notes[0]?.id || (hasNotes ? null : fallback.ui.activeNoteId)),
      contactFilter,
      contactSort
    }
  };
}

function coerceArray(value) {
  return Array.isArray(value) ? value : [];
}

function asTrimmedString(value, fallback = "") {
  const result = String(value ?? fallback).trim();
  return result || fallback;
}

function asNumber(value, fallback = 0) {
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : fallback;
}

function asStringList(value) {
  if (Array.isArray(value)) {
    return value.map((item) => String(item).trim()).filter(Boolean);
  }
  return splitCSV(value);
}

function normalizeContactSource(value) {
  const normalized = String(value || "").trim().toLowerCase();
  return ["sample", "manual", "csv", "vcf", "device"].includes(normalized) ? normalized : "manual";
}

function normalizeMeeting(value) {
  if (!value || typeof value !== "object") {
    return null;
  }
  const title = asTrimmedString(value.title, "Untitled Meeting");
  const date = /^\d{4}-\d{2}-\d{2}$/.test(value.date || "") ? value.date : toLocalISODate(new Date());
  const time = /^\d{2}:\d{2}$/.test(value.time || "") ? value.time : "09:00";

  return {
    id: asTrimmedString(value.id, createId("meeting")),
    title,
    date,
    time,
    duration: Math.max(15, asNumber(value.duration, 30)),
    roomCode: normalizeRoomCode(value.roomCode || `${ROOM_PREFIX}-${title}-${date}`),
    type: asTrimmedString(value.type, "Internal"),
    participants: asStringList(value.participants),
    agenda: asTrimmedString(value.agenda, "No agenda added yet."),
    createdAt: asTrimmedString(value.createdAt, new Date().toISOString()),
    lastJoinedAt: asTrimmedString(value.lastJoinedAt, "")
  };
}

function normalizeContact(value) {
  if (!value || typeof value !== "object") {
    return null;
  }

  const source = normalizeContactSource(value.source);

  return {
    id: asTrimmedString(value.id, createId("contact")),
    name: asTrimmedString(value.name, "New Contact"),
    title: asTrimmedString(value.title, "Contact"),
    email: asTrimmedString(value.email, ""),
    phone: asTrimmedString(value.phone, ""),
    location: asTrimmedString(value.location, "Remote"),
    status: asTrimmedString(value.status, "Available"),
    favorite: value.favorite === true || value.favorite === "true",
    company: asTrimmedString(value.company, source === "sample" ? "Legacy Sample" : "Independent"),
    notes: asTrimmedString(value.notes, ""),
    source,
    lastUpdated: asTrimmedString(value.lastUpdated, new Date().toISOString())
  };
}

function normalizeMessage(value) {
  if (!value || typeof value !== "object") {
    return null;
  }

  return {
    id: asTrimmedString(value.id, createId("msg")),
    author: asTrimmedString(value.author, "Teammate"),
    text: asTrimmedString(value.text, ""),
    own: value.own === true,
    timestamp: asTrimmedString(value.timestamp, new Date().toISOString())
  };
}

function normalizeChat(value) {
  if (!value || typeof value !== "object") {
    return null;
  }

  const messages = coerceArray(value.messages).map(normalizeMessage).filter(Boolean);
  const participants = asStringList(value.participants);
  const name = asTrimmedString(value.name, "New conversation");

  return {
    id: asTrimmedString(value.id, createId("chat")),
    type: value.type === "direct" ? "direct" : "channel",
    name,
    contactId: asTrimmedString(value.contactId, ""),
    participants: participants.length ? participants : [name],
    unread: Math.max(0, asNumber(value.unread, 0)),
    messages: messages.length ? messages : [
      {
        id: createId("msg"),
        author: "System",
        text: "Conversation started.",
        own: false,
        timestamp: new Date().toISOString()
      }
    ]
  };
}

function normalizeTask(value) {
  if (!value || typeof value !== "object") {
    return null;
  }

  const dueDate = /^\d{4}-\d{2}-\d{2}$/.test(value.dueDate || "") ? value.dueDate : "";
  const status = ["todo", "inprogress", "done"].includes(value.status) ? value.status : "todo";
  const priority = ["Low", "Medium", "High", "Critical"].includes(value.priority) ? value.priority : "Medium";

  return {
    id: asTrimmedString(value.id, createId("task")),
    title: asTrimmedString(value.title, "New Task"),
    description: asTrimmedString(value.description, ""),
    priority,
    status,
    dueDate,
    assignee: asTrimmedString(value.assignee, "")
  };
}

function normalizeNote(value) {
  if (!value || typeof value !== "object") {
    return null;
  }

  return {
    id: asTrimmedString(value.id, createId("note")),
    title: asTrimmedString(value.title, "Untitled note"),
    content: asTrimmedString(value.content, ""),
    tags: asStringList(value.tags),
    updatedAt: asTrimmedString(value.updatedAt, new Date().toISOString())
  };
}

function createSeedState() {
  return {
    profile: {
      name: getUserDisplayName(),
      role: "Workspace Owner",
      email: app.user?.email || ""
    },
    settings: {
      accent: "ocean",

    contacts: [],
    chats: [],
    tasks: [],
    notes: [],
    ui: {
      activeChatId: null,

function noteSeed(title, content, tags) {
  return {
    id: createId("note"),
    title,
    content,
    tags,
    updatedAt: new Date().toISOString()
  };
}

function createId(prefix) {
  if (window.crypto?.randomUUID) {
    return `${prefix}-${crypto.randomUUID()}`;
  }
  return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
}

    ? `${chat.participants.length} members`
    : (linkedContact?.title || "Direct thread");
  return `
    <button class="conversation-card ${chat.id === app.activeChatId ? "active" : ""}" data-action="select-chat" data-id="${chat.id}">
      <div class="conversation-card-header">
        <div class="contact-topline">
          <div class="avatar avatar-medium">${initials(chat.name)}</div>
          <div>
            <h4>${escapeHtml(chat.name)}</h4>
            <p>${lastMessage ? escapeHtml(lastMessage.text.slice(0, 54)) : "No messages yet"}</p>

function getFilteredMeetings() {
  const upcoming = getUpcomingMeetings();
  const today = getTodayMeetings();
  const history = [...app.data.meetings].filter((meeting) => !isFutureMeeting(meeting)).sort(compareMeetingsDesc);

  if (app.meetingFilter === "today") {
    return today;
  }
  if (app.meetingFilter === "history") {
    return history;
  }
  return upcoming;
}

function getUpcomingMeetings() {
  return [...app.data.meetings].filter(isFutureMeeting).sort(compareMeetingsAsc);
}

function getTodayMeetings() {
  const today = toLocalISODate(new Date());
  return [...app.data.meetings].filter((meeting) => meeting.date === today).sort(compareMeetingsAsc);
}

function compareMeetingsAsc(left, right) {
  return meetingToDate(left) - meetingToDate(right);
}

function compareMeetingsDesc(left, right) {
  return meetingToDate(right) - meetingToDate(left);
}

function meetingToDate(meeting) {
  return new Date(`${meeting.date}T${meeting.time || "00:00"}`);
}

function isFutureMeeting(meeting) {
  return meetingToDate(meeting) >= new Date();
}

function totalUnreadCount() {
  return app.data.chats.reduce((total, chat) => total + (chat.unread || 0), 0);
}

function getRecentMessages() {
  return app.data.chats
    .flatMap((chat) => chat.messages.map((message) => ({ chatName: chat.name, message })))
    .sort((left, right) => new Date(right.message.timestamp) - new Date(left.message.timestamp))
    .slice(0, 4);
}

function getActiveChat() {
  return app.data.chats.find((chat) => chat.id === app.activeChatId) || app.data.chats[0] || null;
}

function getActiveNote() {
  return app.data.notes.find((note) => note.id === app.activeNoteId) || app.data.notes[0] || null;
}

function ensureMeetingRecord(roomCode, title = "Joined Room") {
  const safeRoom = normalizeRoomCode(roomCode);
  if (!safeRoom) {
    return null;
  }

  let meeting = app.data.meetings.find((item) => item.roomCode === safeRoom) || null;
  if (meeting) {
    return meeting;
  }

  const now = new Date();
  meeting = normalizeMeeting({
    id: createId("meeting"),
    title: title || "Joined Room",
    date: toLocalISODate(now),
    time: now.toTimeString().slice(0, 5),
    duration: 45,
    roomCode: safeRoom,
    type: "Room",
    participants: [],
    agenda: "Shared room opened from a room code.",
    createdAt: now.toISOString(),
    lastJoinedAt: now.toISOString()
  });
  app.data.meetings.unshift(meeting);
  return meeting;
}

function getMeetingPhase(meeting) {
  if (!meeting) {
    return "Live";
  }
  const start = meetingToDate(meeting).getTime();
  const durationMs = Math.max(15, Number(meeting.duration || 45)) * 60000;
  const end = start + durationMs;
  const now = Date.now();
  if (!Number.isFinite(start)) {
    return "Live";
  }
  if (now < start) {
    return "Upcoming";
  }
  if (now <= end) {
    return "In progress";
  }
  return "Reopened";
}

function formatMeetingCountdown(meeting) {
  if (!meeting) {
    return "Open room";
  }
  const start = meetingToDate(meeting).getTime();
  if (!Number.isFinite(start)) {
    return "Open room";
  }
  const delta = start - Date.now();
  if (Math.abs(delta) < 60000) {
    return "Starting now";
  }
  if (delta > 0) {
    const minutes = Math.round(delta / 60000);
    if (minutes < 60) {
      return `Starts in ${minutes}m`;
    }
    const hours = Math.round(minutes / 60);
    return `Starts in ${hours}h`;
  }
  const minutesAgo = Math.round(Math.abs(delta) / 60000);
  if (minutesAgo < 60) {
    return `Started ${minutesAgo}m ago`;
  }
  const hoursAgo = Math.round(minutesAgo / 60);
  return `Started ${hoursAgo}h ago`;
}

function copyRoomLink(roomCode) {
  const safeRoom = normalizeRoomCode(roomCode);
  const text = buildRoomLink(safeRoom);
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      notify("Invite copied", text);
    }).catch(() => {
      fallbackCopy(text);
    });
    return;
  }
  fallbackCopy(text);
}

function fallbackCopy(text) {
  const temp = document.createElement("textarea");
  temp.value = text;
  temp.style.position = "fixed";
  temp.style.opacity = "0";
  document.body.appendChild(temp);
  temp.select();
  document.execCommand("copy");
  temp.remove();
  notify("Invite copied", text);
}

function toggleMeetingControl(control) {
  if (!app.activeRoomCode) {
    return;
  }

  if (control === "muted") {
    app.roomUi.muted = !app.roomUi.muted;
    notify(app.roomUi.muted ? "Microphone muted" : "Microphone live");
  }

  if (control === "videoOff") {
    app.roomUi.videoOff = !app.roomUi.videoOff;
    notify(app.roomUi.videoOff ? "Video stopped" : "Video started");
  }

  if (control === "showParticipants") {
    app.roomUi.showParticipants = !app.roomUi.showParticipants;
    notify(app.roomUi.showParticipants ? "Participants shown" : "Participants hidden");
  }

  if (control === "shareActive") {
    app.roomUi.shareActive = !app.roomUi.shareActive;
    notify(app.roomUi.shareActive ? "Screen share started" : "Screen share stopped");
  }

  const linkedMeeting = app.data?.meetings?.find((meeting) => meeting.roomCode === app.activeRoomCode);
  openMeetingRoom(app.activeRoomCode, linkedMeeting?.title || "Live Room");
}

function buildRoomLink(roomCode) {
  const base = `${window.location.origin || ""}${window.location.pathname || ""}`;
  return `${base}#room=${encodeURIComponent(roomCode)}`;
}

function setRoomHash(roomCode) {
  const nextHash = `#room=${encodeURIComponent(roomCode)}`;
  if (window.location.hash !== nextHash) {
    app.suppressNextHashSync = true;
    window.location.hash = nextHash;
  }
}

function clearRoomHash() {
  if (window.location.hash.startsWith("#room=")) {
    history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
  }
}

function handleRoomHash() {
  if (!app.user) {
    return;
  }
  if (app.suppressNextHashSync) {
    app.suppressNextHashSync = false;
    return;
  }
  const hash = window.location.hash || "";
  if (!hash.startsWith("#room=")) {
    return;
  }
  const roomCode = normalizeRoomCode(decodeURIComponent(hash.slice(6)));
  if (!roomCode) {
    return;
  }
  if (app.activeRoomCode === roomCode && document.getElementById("modal-root").innerHTML) {
    return;
  }
  const linkedMeeting = app.data?.meetings?.find((meeting) => meeting.roomCode === roomCode);
  openMeetingRoom(roomCode, linkedMeeting?.title || "Linked Room");
}

function buildRoomMembers(meeting) {
  const members = [
    {
      name: app.data.profile.name,
      role: app.data.profile.role,
      status: "Host"
    }
  ];
  (meeting?.participants || []).slice(0, 5).forEach((name) => {
    const contact = app.data.contacts.find((item) => item.name === name);
    members.push({
      name,
      role: contact?.title || "Participant",
      status: contact?.status || "In room"
    });
  });
  if (members.length < 4) {
    members.push({
      name: "Waiting Room",
      role: "Invite others with the room link",
      status: "Open"
    });
  }
  return members.slice(0, 6);
}

function scheduleMeeting(formData) {
  const title = String(formData.get("title") || "").trim();
  const date = String(formData.get("date") || "").trim();
  const time = String(formData.get("time") || "").trim();

  if (!title || !date || !time) {

  const meeting = {

  };

function saveContact(formData) {
  const name = String(formData.get("name") || "").trim();
  if (!name) {
    notify("Display name required", "Add at least a display name to save this contact.", true);
    return;
  }
  const existingContact = app.data.contacts.find((contact) => contact.id === formData.get("id"));
  const payload = normalizeContact({
    id: formData.get("id") || createId("contact"),
    name,
    title: formData.get("title").trim(),
    email: formData.get("email").trim(),
    phone: formData.get("phone").trim(),
    location: formData.get("location").trim(),
    company: formData.get("company").trim(),
    status: formData.get("status"),
    notes: formData.get("notes").trim(),
    favorite: existingContact?.favorite || false,
    source: existingContact?.source || "manual",
    lastUpdated: new Date().toISOString()
  });

  const existingIndex = app.data.contacts.findIndex((contact) => contact.id === payload.id);
  if (existingIndex >= 0) {
    app.data.contacts[existingIndex] = payload;
  } else {
    app.data.contacts.unshift(payload);
  }
  saveState();
  renderApp();
  closeModal();
  notify("Contact saved", `${payload.name} is now in your directory.`);
}

    status: "Available",
    notes: "",
    favorite: false,
    source: "manual",

async function pickDeviceContacts() {
  if (!supportsDeviceContacts()) {
    notify("Device import unavailable", "This browser does not expose the Contact Picker API. Try CSV or VCF import instead.", true);
    return;
  }

  try {
    const picked = await navigator.contacts.select(["name", "email", "tel", "address"], { multiple: true });
    const contacts = picked.map((entry) => ({
      name: firstNonEmpty(entry.name?.[0], entry.name),
      email: firstNonEmpty(entry.email?.[0], entry.email),
      phone: firstNonEmpty(entry.tel?.[0], entry.tel),
      location: formatDeviceAddress(entry.address?.[0] || entry.address),
      title: "Contact",
      company: "",
      notes: ""
    })).filter((contact) => contact.name || contact.email || contact.phone);

    importContacts(contacts, "device");
  } catch (error) {
    if (error?.name === "AbortError") {
      return;
    }
    notify("Device import blocked", "Permission was denied or the device did not return contacts.", true);
  }
}

function formatDeviceAddress(address) {
  if (!address) {
    return "";
  }
  if (typeof address === "string") {
    return address.trim();
  }
  return [address.city, address.region, address.country].map((value) => String(value || "").trim()).filter(Boolean).join(", ");
}

function parseCSVContacts(text) {
  const rows = parseCSVRows(text);
  if (rows.length < 2) {
    return [];
  }

  const headers = rows[0].map((header) => normalizeHeader(header));

  return rows.slice(1).map((row) => {
    const get = (...aliases) => {
      const headerIndex = headers.findIndex((header) => aliases.includes(header));
      return headerIndex >= 0 ? String(row[headerIndex] || "").trim() : "";
    };

    const firstName = get("first name", "first");
    const lastName = get("last name", "last");
    const name = firstNonEmpty(
      get("name", "full name", "display name"),
      `${firstName} ${lastName}`.trim()
    );

    return {
      name,
      title: get("title", "job title", "role"),
      email: get("email", "email address", "e mail"),
      phone: get("phone", "mobile", "mobile phone", "cell", "telephone"),
      company: get("company", "organization", "organisation"),
      location: firstNonEmpty(get("location", "city"), get("address")),
      notes: get("notes", "note", "comments")
    };
  }).filter((contact) => contact.name || contact.email || contact.phone);
}

function parseCSVRows(text) {
  const source = String(text || "").replace(/^\uFEFF/, "");
  const rows = [];
  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let index = 0; index < source.length; index += 1) {
    const char = source[index];
    const next = source[index + 1];

    if (char === '"') {
      if (inQuotes && next === '"') {
        cell += '"';
        index += 1;
      } else {
        inQuotes = !inQuotes;
      }
      continue;
    }

    if (char === "," && !inQuotes) {
      row.push(cell);
      cell = "";
      continue;
    }

    if ((char === "\n" || char === "\r") && !inQuotes) {
      if (char === "\r" && next === "\n") {
        index += 1;
      }
      row.push(cell);
      if (row.some((value) => String(value || "").trim())) {
        rows.push(row.map((value) => String(value || "").trim()));
      }
      row = [];
      cell = "";
      continue;
    }

    cell += char;
  }

  row.push(cell);
  if (row.some((value) => String(value || "").trim())) {
    rows.push(row.map((value) => String(value || "").trim()));
  }

  return rows;
}

function normalizeHeader(value) {
  return String(value || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}

function parseVCFContacts(text) {
  const source = String(text || "").replace(/\r\n[ \t]/g, "").replace(/\n[ \t]/g, "");
  return source
    .split(/BEGIN:VCARD/i)
    .map((chunk) => chunk.trim())
    .filter(Boolean)
    .map((chunk) => {
      const lines = chunk.split(/\r?\n/).filter(Boolean);
      const name = decodeVCardValue(firstNonEmpty(readVCardField(lines, "FN"), buildVCardName(readVCardField(lines, "N"))));
      const email = decodeVCardValue(readVCardField(lines, "EMAIL"));
      const phone = decodeVCardValue(readVCardField(lines, "TEL"));
      const company = decodeVCardValue(readVCardField(lines, "ORG"));
      const title = decodeVCardValue(readVCardField(lines, "TITLE"));
      const notes = decodeVCardValue(readVCardField(lines, "NOTE"));
      const location = buildVCardLocation(readVCardField(lines, "ADR"));

      return { name, email, phone, company, title, notes, location };
    })
    .filter((contact) => contact.name || contact.email || contact.phone);
}

function readVCardField(lines, key) {
  const prefix = key.toUpperCase();
  const match = lines.find((line) => {
    const upper = line.toUpperCase();
    return upper.startsWith(`${prefix}:`) || upper.startsWith(`${prefix};`);
  });
  if (!match) {
    return "";
  }
  return match.slice(match.indexOf(":") + 1).trim();
}

function buildVCardName(value) {
  const parts = String(value || "").split(";").map((part) => part.trim());
  return [parts[1], parts[2], parts[0]].filter(Boolean).join(" ");
}

function buildVCardLocation(value) {
  const parts = String(value || "").split(";").map((part) => decodeVCardValue(part));
  return [parts[3], parts[4], parts[6]].filter(Boolean).join(", ");
}

function decodeVCardValue(value) {
  return String(value || "")
    .replace(/\\n/gi, ", ")
    .replace(/\\,/g, ",")
    .replace(/\\;/g, ";")
    .trim();
}

function importContacts(records, source) {
  const normalizedContacts = records
    .map((record) => normalizeContact({
      ...record,
      source,
      lastUpdated: new Date().toISOString()
    }))
    .filter((contact) => contact && (contact.name || contact.email || contact.phone));

  if (!normalizedContacts.length) {
    notify("No contacts found", "That file did not contain any usable contacts.", true);
    return;
  }

  let importedCount = 0;

  normalizedContacts.forEach((candidate) => {
    const existingIndex = findMatchingContactIndex(candidate);
    if (existingIndex >= 0) {
      const existing = app.data.contacts[existingIndex];
      app.data.contacts[existingIndex] = normalizeContact({
        ...existing,
        ...candidate,
        favorite: existing.favorite || candidate.favorite,
        status: candidate.status || existing.status,
        notes: candidate.notes || existing.notes,
        source: existing.source === "sample" ? source : existing.source,
        lastUpdated: new Date().toISOString()
      });
    } else {
      app.data.contacts.unshift(candidate);
    }
    importedCount += 1;
  });

  app.contactFilter = "real";
  app.contactSort = "recent";
  saveState();
  renderApp();
  notify("Contacts imported", `${importedCount} contact${importedCount === 1 ? "" : "s"} added from ${labelContactSource(source)}.`);
}

function findMatchingContactIndex(candidate) {
  const candidateEmail = String(candidate.email || "").trim().toLowerCase();
  const candidatePhone = normalizePhone(candidate.phone);
  const candidateName = String(candidate.name || "").trim().toLowerCase();

  return app.data.contacts.findIndex((contact) => {
    const contactEmail = String(contact.email || "").trim().toLowerCase();
    const contactPhone = normalizePhone(contact.phone);
    const contactName = String(contact.name || "").trim().toLowerCase();

    return (candidateEmail && contactEmail === candidateEmail)
      || (candidatePhone && contactPhone === candidatePhone)
      || (candidateName && contactName === candidateName);
  });
}

function removeLegacySampleContacts() {
  const before = app.data.contacts.length;
  app.data.contacts = app.data.contacts.filter((contact) => isRealContact(contact));
  const removed = before - app.data.contacts.length;
  app.contactFilter = app.data.contacts.length ? "real" : "all";
  saveState();
  renderApp();
  notify(
    removed ? "Legacy contacts removed" : "Only real contacts remain",
    removed
      ? `${removed} legacy sample contact${removed === 1 ? "" : "s"} removed from the directory.`
      : "Your directory already only contains real contacts."
  );
}

function ensureDirectChatForContact(contact) {
  const existing = app.data.chats.find((chat) => chat.type === "direct" && (chat.contactId === contact.id || chat.name === contact.name));
  if (existing) {
    return existing;
  }

  const chat = {
    id: createId("chat"),
    type: "direct",
    name: contact.name,
    contactId: contact.id,
    participants: [app.data.profile.name, contact.name],
    unread: 0,
    messages: [
      {
        id: createId("msg"),
        author: app.data.profile.name,
        text: `Opened a direct thread with ${contact.name}.`,
        own: true,
        timestamp: new Date().toISOString()
      }
    ]
  };

  app.data.chats.unshift(chat);
  return chat;
}

function startChatWithContact(id) {
  const contact = getContactById(id);
  if (!contact) {
    return;
  }

  const chat = ensureDirectChatForContact(contact);
  app.activeChatId = chat.id;
  app.activeView = "chat";
  saveState();
  closeModal();
  renderApp();
  notify("Direct chat ready", `${contact.name} is now open in Team Chat.`);
}

function startMeetingWithContact(id) {
  const contact = getContactById(id);
  if (!contact) {
    return;
  }

  const roomCode = normalizeRoomCode(`${ROOM_PREFIX}-${contact.name}-direct`);
  let meeting = app.data.meetings.find((item) => item.roomCode === roomCode);

  if (!meeting) {
    const now = new Date();
    meeting = {
      id: createId("meeting"),
      title: `${contact.name} Quick Connect`,
      date: toLocalISODate(now),
      time: `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`,
      duration: 30,
      roomCode,
      type: "Direct",
      participants: [contact.name],
      agenda: `Fast catch-up with ${contact.name}.`,
      createdAt: now.toISOString(),
      lastJoinedAt: ""
    };
    app.data.meetings.unshift(meeting);
  }

  saveState();
  renderApp();
  openMeetingRoom(roomCode, meeting.title);
}

function emailContact(id) {
  const contact = getContactById(id);
  if (!contact?.email) {
    notify("No email available", "Add an email address to launch a draft.", true);
    return;
  }
  window.location.href = `mailto:${contact.email}`;
}

function callContact(id) {
  const contact = getContactById(id);
  if (!contact?.phone) {
    notify("No phone available", "Add a phone number to launch a call action.", true);
    return;
  }
  window.location.href = `tel:${contact.phone}`;
}

function openTaskModal(id) {
  const task = app.data.tasks.find((item) => item.id === id);
  openModal(`
    <div class="modal-header">
      <div>
        <p class="eyebrow">${task ? "Adjust work" : "Plan work"}</p>
        <h3 class="modal-title">${task ? "Edit task" : "New task"}</h3>
        <p class="section-subtle">Keep project momentum visible right inside the workspace.</p>
      </div>
      <button class="ghost icon-button" data-action="close-modal" aria-label="Close">&times;</button>
    </div>
    <form class="form-grid" data-form="task-form">
      <input type="hidden" name="id" value="${task ? task.id : ""}">
      <div class="field-stack">
        <label for="task-title">Title</label>
        <input id="task-title" name="title" value="${escapeAttribute(task?.title || "")}" required>
      </div>
      <div class="field-stack">
        <label for="task-description">Description</label>
        <textarea id="task-description" name="description">${escapeHtml(task?.description || "")}</textarea>
      </div>
      <div class="form-grid two-up">
        <div class="field-stack">
          <label for="task-priority">Priority</label>
          <select id="task-priority" name="priority">
            ${["Low", "Medium", "High", "Critical"].map((priority) => `
              <option ${task?.priority === priority ? "selected" : ""}>${priority}</option>
            `).join("")}
          </select>
        </div>
        <div class="field-stack">
          <label for="task-status">Status</label>
          <select id="task-status" name="status">
            <option value="todo" ${task?.status === "todo" ? "selected" : ""}>To do</option>
            <option value="inprogress" ${task?.status === "inprogress" ? "selected" : ""}>In progress</option>
            <option value="done" ${task?.status === "done" ? "selected" : ""}>Done</option>
          </select>
        </div>
      </div>
      <div class="form-grid two-up">
        <div class="field-stack">
          <label for="task-dueDate">Due date</label>
          <input id="task-dueDate" name="dueDate" type="date" value="${escapeAttribute(task?.dueDate || "")}">
        </div>
        <div class="field-stack">
          <label for="task-assignee">Assignee</label>
          <input id="task-assignee" name="assignee" value="${escapeAttribute(task?.assignee || "")}">
        </div>
      </div>
      <div class="modal-actions">
        <button class="primary" type="submit">${task ? "Save task" : "Create task"}</button>
        <button class="ghost" type="button" data-action="close-modal">Cancel</button>
      </div>
    </form>
  `);
}

function saveTask(formData) {
  const payload = {
    id: formData.get("id") || createId("task"),
    title: formData.get("title").trim(),
    description: formData.get("description").trim(),
    priority: formData.get("priority"),
    status: formData.get("status"),
    dueDate: formData.get("dueDate"),
    assignee: formData.get("assignee").trim()
  };

  const existingIndex = app.data.tasks.findIndex((task) => task.id === payload.id);
  if (existingIndex >= 0) {
    app.data.tasks[existingIndex] = payload;
  } else {
    app.data.tasks.unshift(payload);
  }
  saveState();
  renderApp();
  closeModal();
  notify("Task saved", `${payload.title} is now on the board.`);
}

function cycleTaskStatus(id) {
  const order = ["todo", "inprogress", "done"];
  const task = app.data.tasks.find((item) => item.id === id);
  if (!task) {
    return;
  }
  const nextIndex = (order.indexOf(task.status) + 1) % order.length;
  task.status = order[nextIndex];
  saveState();
  renderApp();
}

function deleteTask(id) {
  app.data.tasks = app.data.tasks.filter((task) => task.id !== id);
  saveState();
  renderApp();
  notify("Task removed", "The board has been updated.");
}

function createNote() {
  const note = noteSeed("Untitled note", "", ["scratchpad"]);
  app.data.notes.unshift(note);
  app.activeNoteId = note.id;
  saveState();
  setActiveView("notes");
  notify("Note created", "The editor is ready for your next recap.");
}

function updateActiveNote(field, value) {
  const note = getActiveNote();
  if (!note) {
    return;
  }
  note[field] = value;
  note.updatedAt = new Date().toISOString();
  saveState();
  renderSidebar();
}

function deleteNote(id) {
  app.data.notes = app.data.notes.filter((note) => note.id !== id);
  app.activeNoteId = app.data.notes[0]?.id || null;
  saveState();
  renderApp();
  notify("Note deleted", "The note list has been refreshed.");
}

function openChatModal() {
  openModal(`
    <div class="modal-header">
      <div>
        <p class="eyebrow">Start a thread</p>
        <h3 class="modal-title">New chat</h3>
        <p class="section-subtle">Create a direct thread or a lightweight channel.</p>
      </div>
      <button class="ghost icon-button" data-action="close-modal" aria-label="Close">&times;</button>
    </div>
    <form class="form-grid" data-form="chat-form">
      <div class="field-stack">
        <label for="chat-name">Name</label>
        <input id="chat-name" name="name" placeholder="# launch-room or Jordan Lee" required>
      </div>
      <div class="field-stack">
        <label for="chat-type">Type</label>
        <select id="chat-type" name="type">
          <option value="channel">Channel</option>
          <option value="direct">Direct</option>
        </select>
      </div>
      <div class="field-stack">
        <label for="chat-participants">Participants</label>
        <input id="chat-participants" name="participants" placeholder="You, Jordan Lee">
      </div>
      <div class="modal-actions">
        <button class="primary" type="submit">Create chat</button>
        <button class="ghost" type="button" data-action="close-modal">Cancel</button>
      </div>
    </form>
  `);
}

function saveChat(formData) {
  const participants = splitCSV(formData.get("participants"));
  const matchedContact = formData.get("type") === "direct"
    ? app.data.contacts.find((contact) => contact.name.toLowerCase() === formData.get("name").trim().toLowerCase())
    : null;
  if (!participants.includes(app.data.profile.name)) {
    participants.unshift(app.data.profile.name);
  }
  const chat = {
    id: createId("chat"),
    type: formData.get("type"),
    name: formData.get("name").trim(),
    contactId: matchedContact?.id || "",
    participants,
    unread: 0,
    messages: [
      {
        id: createId("msg"),
        author: app.data.profile.name,
        text: "Conversation started.",
        own: true,
        timestamp: new Date().toISOString()
      }
    ]
  };
  app.data.chats.unshift(chat);
  app.activeChatId = chat.id;
  saveState();
  renderApp();
  closeModal();
  notify("Conversation created", `${chat.name} is ready.`);
}

function sendMessage(chatId, text) {
  const chat = app.data.chats.find((item) => item.id === chatId);
  if (!chat) {
    return;
  }
  chat.messages.push({
    id: createId("msg"),
    author: app.data.profile.name,
    text,
    own: true,
    timestamp: new Date().toISOString()
  });
  saveState();
  renderApp();
}

function addAutoReply(chatId) {
  const chat = app.data.chats.find((item) => item.id === chatId);
  if (!chat) {
    return;
  }
  const speaker = chat.participants.find((name) => name !== app.data.profile.name) || "Teammate";
  const canned = [
    "Looks good from my side. I can pick this up next.",
    "Let us keep the current plan and revisit after the next call.",
    "I added context to the note so the rest of the team can follow along.",
    "Perfect. I will join the room five minutes early."
  ];
  chat.messages.push({
    id: createId("msg"),
    author: speaker,
    text: canned[Math.floor(Math.random() * canned.length)],
    own: false,
    timestamp: new Date().toISOString()
  });
  chat.unread = 0;
  saveState();
  renderApp();
}

function markChatAsRead(chatId) {
  const chat = app.data.chats.find((item) => item.id === chatId);
  if (!chat) {
    return;
  }
  chat.unread = 0;
  saveState();
}

function toggleSetting(setting) {
  app.data.settings[setting] = !app.data.settings[setting];
  saveState();
  applySettings();
  renderApp();
}

function applySettings() {
  document.body.dataset.accent = app.data.settings.accent;
  document.body.classList.toggle("compact-mode", !!app.data.settings.compactMode);
}

function exportData() {
  const payload = JSON.stringify(app.data, null, 2);
  const blob = new Blob([payload], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = "zoom-workplace-export.json";
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  URL.revokeObjectURL(url);
  notify("Export ready", "Your workspace snapshot was downloaded as JSON.");
}

function resetData() {
  app.data = createSeedState();
  app.activeChatId = app.data.ui.activeChatId;
  app.activeNoteId = app.data.ui.activeNoteId;
  app.contactFilter = app.data.ui.contactFilter;
  app.contactSort = app.data.ui.contactSort;
  saveState();
  applySettings();
  renderApp();
  notify("Workspace reset", "Your workspace has been cleared and restored to an empty state.");
}

function openModal(content, options = {}) {
  const root = document.getElementById("modal-root");
  document.body.classList.add("modal-open");
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="${options.shellClass === "meeting" ? "meeting-room-shell" : `modal ${options.wide ? "wide" : ""}`}">
        ${content}
      </div>
    </div>
  `;
}

function closeModal() {
  const root = document.getElementById("modal-root");
  if (root.innerHTML) {
    root.innerHTML = "";
  }
  app.activeRoomCode = null;
  clearRoomHash();
  document.body.classList.remove("modal-open");
}

function notify(title, detail = "", isError = false) {
  if (!app.data.settings.notifications && !isError) {
    return;
  }
  const root = document.getElementById("toast-root");
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerHTML = `<strong>${escapeHtml(title)}</strong>${detail ? `<small>${escapeHtml(detail)}</small>` : ""}`;
  root.appendChild(toast);
  window.setTimeout(() => toast.remove(), 3400);
}

function startClock() {
  updateClock();
  app.clockTimer = window.setInterval(updateClock, 1000);
}

function updateClock() {
  const now = new Date();
  document.getElementById("clock-display").textContent = now.toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function formatMeetingMoment(meeting) {
  if (!meeting) {
    return "No schedule";
  }
  return `${formatDate(meeting.date)} - ${formatTime(meeting.time)}`;
}

function formatDate(dateString) {
  if (!dateString) {
    return "No date";
  }
  return new Date(`${dateString}T00:00`).toLocaleDateString([], {
    weekday: "short",
    month: "short",
    day: "numeric"
  });
}

function formatTime(time) {
  if (!time) {
    return "--:--";
  }
  return new Date(`2000-01-01T${time}`).toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });
}

function formatRelative(timestamp) {
  const delta = Date.now() - new Date(timestamp).getTime();
  const minutes = Math.round(delta / 60000);
  if (minutes < 1) {
    return "just now";
  }
  if (minutes < 60) {
    return `${minutes}m ago`;
  }
  const hours = Math.round(minutes / 60);
  if (hours < 24) {
    return `${hours}h ago`;
  }
  const days = Math.round(hours / 24);
  return `${days}d ago`;
}

function capitalize(value) {
  return value.charAt(0).toUpperCase() + value.slice(1);
}

function splitCSV(value) {
  return String(value || "")
    .split(",")
    .map((item) => item.trim())
    .filter(Boolean);
}

function normalizePhone(value) {
  return String(value || "").replace(/[^\d+]/g, "");
}

function firstNonEmpty(...values) {
  return values.map((value) => String(value || "").trim()).find(Boolean) || "";
}

function initials(name) {
  return String(name || "")
    .split(" ")
    .filter(Boolean)
    .slice(0, 2)
    .map((part) => part[0])
    .join("")
    .toUpperCase() || "OW";
}

function normalizeRoomCode(value) {
  return String(value || "")
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9-]+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "")
    .slice(0, 80);
}

function toLocalISODate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function isRealContact(contact) {
  return normalizeContactSource(contact?.source) !== "sample";
}

function isAvailableContact(contact) {
  return String(contact?.status || "").toLowerCase() === "available";
}

function labelContactSource(source) {
  const normalized = normalizeContactSource(source);
  if (normalized === "device") {
    return "Device";
  }
  if (normalized === "csv") {
    return "CSV";
  }
  if (normalized === "vcf") {
    return "VCF";
  }
  if (normalized === "sample") {
    return "Legacy Sample";
  }
  return "Manual";
}

function supportsDeviceContacts() {
  return !!navigator.contacts?.select;
}

function getContactById(id) {
  return app.data.contacts.find((contact) => contact.id === id) || null;
}

function getDirectChatForContact(contact) {
  if (!contact) {
    return null;
  }
  return app.data.chats.find((chat) => chat.type === "direct" && (chat.contactId === contact.id || chat.name === contact.name)) || null;
}

function getContactForChat(chat) {
  if (!chat || chat.type !== "direct") {
    return null;
  }
  return app.data.contacts.find((contact) => contact.id === chat.contactId || contact.name === chat.name) || null;
}

function getContactMeetings(contact) {
  if (!contact) {
    return [];
  }
  return [...app.data.meetings]
    .filter((meeting) => (meeting.participants || []).includes(contact.name))
    .sort(compareMeetingsAsc);
}

function getContactTasks(contact) {
  if (!contact) {
    return [];
  }
  return [...app.data.tasks]
    .filter((task) => task.assignee === contact.name)
    .sort((left, right) => {
      const doneDelta = Number(left.status === "done") - Number(right.status === "done");
      if (doneDelta) {
        return doneDelta;
      }
      if (left.dueDate && right.dueDate) {
        return new Date(left.dueDate) - new Date(right.dueDate);
      }
      return left.title.localeCompare(right.title);
    });
}

function getContactMessages(contact) {
  const chat = getDirectChatForContact(contact);
  if (!chat) {
    return [];
  }
  return [...chat.messages]
    .sort((left, right) => new Date(right.timestamp) - new Date(left.timestamp))
    .slice(0, 4);
}

function getContactCompleteness(contact) {
  const checks = [
    !!contact?.name,
    !!contact?.title,
    !!contact?.email,
    !!contact?.phone,
    !!contact?.location,
    !!contact?.company,
    !!contact?.notes
  ];
  const ratio = checks.filter(Boolean).length / checks.length;
  return Math.round(ratio * 100);
}

function getContactFreshness(contact) {
  const timestamp = new Date(contact?.lastUpdated || 0).getTime();
  return Number.isFinite(timestamp) ? timestamp : 0;
}

function compareContacts(left, right) {
  if (app.contactSort === "recent") {
    return getContactFreshness(right) - getContactFreshness(left) || left.name.localeCompare(right.name);
  }

  if (app.contactSort === "name") {
    return left.name.localeCompare(right.name);
  }

  if (app.contactSort === "company") {
    return (left.company || "").localeCompare(right.company || "") || left.name.localeCompare(right.name);
  }

  const favoriteDelta = Number(right.favorite) - Number(left.favorite);
  if (favoriteDelta) {
    return favoriteDelta;
  }

  const realDelta = Number(isRealContact(right)) - Number(isRealContact(left));
  if (realDelta) {
    return realDelta;
  }

  const availableDelta = Number(isAvailableContact(right)) - Number(isAvailableContact(left));
  if (availableDelta) {
    return availableDelta;
  }

  const completenessDelta = getContactCompleteness(right) - getContactCompleteness(left);
  if (completenessDelta) {
    return completenessDelta;
  }

  return getContactFreshness(right) - getContactFreshness(left) || left.name.localeCompare(right.name);
}

function getTopContact(contacts = app.data.contacts) {
  return [...contacts].sort(compareContacts)[0] || null;
}

function renderProfileValue(label, value) {
  return `
    <div class="profile-kv">
      <span>${escapeHtml(label)}</span>
      <strong>${escapeHtml(value)}</strong>
    </div>
  `;
}

function getSourceCounts(contacts = app.data.contacts) {
  return contacts.reduce((counts, contact) => {
    const source = normalizeContactSource(contact.source);
    counts[source] = (counts[source] || 0) + 1;
    return counts;
  }, {
    sample: 0,
    manual: 0,
    csv: 0,
    vcf: 0,
    device: 0
  });
}

function getVisibleContacts() {
  return [...app.data.contacts]
    .filter((contact) => {
      if (app.contactFilter === "real") {
        return isRealContact(contact);
      }
      if (app.contactFilter === "favorite") {
        return contact.favorite;
      }
      if (app.contactFilter === "available") {
        return isAvailableContact(contact);
      }
      return true;
    })
    .sort(compareContacts);
}

function isDueSoon(dateString) {
  if (!dateString) {
    return false;
  }
  const now = new Date();
  const due = new Date(`${dateString}T23:59`);
  return due - now <= 1000 * 60 * 60 * 48;
}

function renderStatusDot(status) {
  const normalized = status.toLowerCase();
  const className = normalized.includes("available") ? "online" : normalized.includes("away") ? "away" : normalized.includes("meeting") || normalized.includes("disturb") ? "busy" : "offline";
  return `<span class="status-dot ${className}"></span>`;
}

function renderEmptyState(title, detail) {
  return `
    <div class="empty-state">
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(detail)}</p>
    </div>
  `;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function escapeAttribute(value) {
  return escapeHtml(value).replace(/`/g, "&#96;");
}
